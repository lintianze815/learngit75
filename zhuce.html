<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 + 用户列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .tab-group {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: none;
            color: #999;
        }

        .tab.active {
            color: #667eea;
            font-weight: bold;
            border-bottom: 3px solid #667eea;
        }

        .form-box {
            display: none;
        }

        .form-box.active {
            display: block;
        }

        .title {
            text-align: center;
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .error-text {
            color: #ff4d4f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .form-group.error input,
        .form-group.error select {
            border-color: #ff4d4f;
        }

        .form-group.error .error-text {
            display: block;
        }

        .hobbies-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .hobby-item {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
        }

        .modal-icon {
            width: 50px; height: 50px;
            background: #52c41a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            margin: 0 auto 15px;
        }

        .modal-title {
            color: #52c41a;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .modal-text {
            margin-bottom: 20px;
            color: #666;
        }

        .modal-btn {
            padding: 10px 30px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        /* 用户列表样式 */
        .user-list-section {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 30px;
        }

        .section-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
        }

        .user-card {
            background: #f0f2f5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info-item {
            margin-bottom: 6px;
            color: #333;
        }

        .hobby-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-right: 6px;
            margin-top: 4px;
        }

        .register-time {
            font-size: 13px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-group">
        <button class="tab" onclick="switchTab('login')">登录</button>
        <button class="tab active" onclick="switchTab('register')">注册</button>
    </div>

    <!-- 登录 -->
    <div id="loginForm" class="form-box">
        <h2 class="title">用户登录</h2>
        <form onsubmit="login(event)">
            <div class="form-group" id="loginUserGroup">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
                <p class="error-text">用户名不能为空</p>
            </div>
            <div class="form-group" id="loginPwdGroup">
                <label>密码</label>
                <input type="password" id="loginPwd" placeholder="请输入密码">
                <p class="error-text">密码不能为空</p>
            </div>
            <button type="submit" class="submit-btn">登录</button>
        </form>
    </div>

    <!-- 注册 -->
    <div id="registerForm" class="form-box active">
        <h2 class="title">用户注册</h2>
        <form onsubmit="register(event)">
            <div class="form-group" id="userGroup">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名（3-10个字符）">
                <p class="error-text">用户名格式不正确</p>
            </div>
            <div class="form-group" id="emailGroup">
                <label>邮箱</label>
                <input type="email" id="email" placeholder="请输入有效邮箱">
                <p class="error-text">邮箱格式不正确</p>
            </div>
            <div class="form-group" id="pwdGroup">
                <label>密码</label>
                <input type="password" id="password" placeholder="至少6位，包含字母和数字">
                <p class="error-text">密码格式不正确</p>
            </div>
            <div class="form-group" id="ageGroup">
                <label>年龄</label>
                <input type="number" id="age" min="18" max="100" placeholder="请输入年龄（18-100）">
                <p class="error-text">年龄必须在18-100之间</p>
            </div>
            <div class="form-group" id="genderGroup">
                <label>性别</label>
                <select id="gender">
                    <option value="">请选择</option>
                    <option>男</option>
                    <option>女</option>
                </select>
                <p class="error-text">请选择性别</p>
            </div>
            <div class="form-group" id="hobbyGroup">
                <label>兴趣爱好</label>
                <div class="hobbies-group">
                    <label class="hobby-item">
                        <input type="checkbox" name="hobby" value="阅读"> 阅读
                    </label>
                    <label class="hobby-item">
                        <input type="checkbox" name="hobby" value="运动"> 运动
                    </label>
                    <label class="hobby-item">
                        <input type="checkbox" name="hobby" value="音乐"> 音乐
                    </label>
                    <label class="hobby-item">
                        <input type="checkbox" name="hobby" value="旅行"> 旅行
                    </label>
                    <label class="hobby-item">
                        <input type="checkbox" name="hobby" value="编程"> 编程
                    </label>
                </div>
                <p class="error-text">至少选择一个爱好</p>
            </div>
            <button type="submit" class="submit-btn">注册</button>
        </form>
    </div>

    <!-- 已注册用户列表 -->
    <div class="user-list-section">
        <h3 class="section-title">已注册用户列表</h3>
        <div id="userListContainer">
            <!-- 用户卡片会通过JS动态渲染 -->
        </div>
    </div>
</div>

<!-- 成功弹窗 -->
<div class="modal" id="successModal">
    <div class="modal-content">
        <div class="modal-icon">✓</div>
        <h3 class="modal-title" id="modalTitle">成功</h3>
        <p class="modal-text" id="modalMsg"></p>
        <button class="modal-btn" onclick="closeModal()">确定</button>
    </div>
</div>

<script>
    // 页面加载时渲染用户列表
    document.addEventListener('DOMContentLoaded', renderUserList);

    // 切换登录/注册
    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-box').forEach(f => f.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(type + 'Form').classList.add('active');
    }

    // 注册
    function register(e) {
        e.preventDefault();
        clearErrors();

        const user = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const pwd = document.getElementById('password').value;
        const age = document.getElementById('age').value;
        const gender = document.getElementById('gender').value;
        const hobbiesCheckboxes = document.querySelectorAll('input[name="hobby"]:checked');
        const hobbies = Array.from(hobbiesCheckboxes).map(cb => cb.value);

        let ok = true;

        if (user.length < 3 || user.length > 10) {
            document.getElementById('userGroup').classList.add('error'); ok = false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            document.getElementById('emailGroup').classList.add('error'); ok = false;
        }
        if (!/^(?=.*[A-Za-z])(?=.*\d).{6,}$/.test(pwd)) {
            document.getElementById('pwdGroup').classList.add('error'); ok = false;
        }
        if (age < 18 || age > 100) {
            document.getElementById('ageGroup').classList.add('error'); ok = false;
        }
        if (!gender) {
            document.getElementById('genderGroup').classList.add('error'); ok = false;
        }
        if (hobbies.length === 0) {
            document.getElementById('hobbyGroup').classList.add('error'); ok = false;
        }

        if (ok) {
            const now = new Date();
            const registerTime = now.getFullYear() + '/' + 
                                String(now.getMonth()+1).padStart(2,'0') + '/' + 
                                String(now.getDate()).padStart(2,'0') + ' ' + 
                                String(now.getHours()).padStart(2,'0') + ':' + 
                                String(now.getMinutes()).padStart(2,'0') + ':' + 
                                String(now.getSeconds()).padStart(2,'0');

            const newUser = {
                username: user,
                password: pwd,
                email: email,
                age: age,
                gender: gender,
                hobbies: hobbies,
                registerTime: registerTime
            };

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            showModal('注册成功！', '可以使用账号登录啦');
            renderUserList(); // 注册成功后更新用户列表
            document.getElementById('registerForm').reset();
        }
    }

    // 登录
    function login(e) {
        e.preventDefault();
        clearErrors();

        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPwd').value;
        const users = JSON.parse(localStorage.getItem('users') || '[]');

        const find = users.find(u => u.username === username && u.password === password);

        if (!username) {
            document.getElementById('loginUserGroup').classList.add('error');
        }
        if (!password) {
            document.getElementById('loginPwdGroup').classList.add('error');
        }
        if (username && password && !find) {
            showModal('登录失败', '用户名或密码错误');
            return;
        }
        if (find) {
            showModal('登录成功', '欢迎回来，' + username);
        }
    }

    // 渲染用户列表
    function renderUserList() {
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const container = document.getElementById('userListContainer');
        container.innerHTML = '';

        if (users.length === 0) {
            container.innerHTML = '<p style="color:#999;">暂无注册用户</p>';
            return;
        }

        users.forEach(u => {
            const hobbiesHTML = u.hobbies.map(h => `<span class="hobby-tag">${h}</span>`).join('');
            const userCard = document.createElement('div');
            userCard.className = 'user-card';
            userCard.innerHTML = `
                <div class="user-name">
                    <span>👤</span> ${u.username}
                </div>
                <div class="user-info-item">邮箱: ${u.email}</div>
                <div class="user-info-item">年龄: ${u.age}岁</div>
                <div class="user-info-item">性别: ${u.gender}</div>
                <div class="user-info-item">兴趣爱好: ${hobbiesHTML}</div>
                <div class="register-time">注册时间: ${u.registerTime}</div>
            `;
            container.appendChild(userCard);
        });
    }

    // 工具
    function clearErrors() {
        document.querySelectorAll('.form-group').forEach(g => g.classList.remove('error'));
    }

    function showModal(title, msg) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMsg').innerText = msg;
        document.getElementById('successModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('successModal').style.display = 'none';
    }
</script>

</body>
</html>
