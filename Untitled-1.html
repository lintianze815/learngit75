<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精选购物商城</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        :root {
            --main: #e04b3a;
            --bg: #f9f5ef;
            --text: #333;
            --gray: #666;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: #fff;
            border-bottom: 1px solid #eee;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .logo span {
            color: var(--main);
        }
        nav a {
            text-decoration: none;
            color: var(--text);
            margin-left: 1.5rem;
        }
        nav a.btn {
            background: var(--main);
            color: #fff;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
        }
        .banner {
            background: #3a2e2b;
            color: #fff;
            text-align: center;
            padding: 5rem 2rem;
        }
        .banner h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .banner p {
            color: #ddd;
            margin-bottom: 2rem;
        }
        .banner a {
            display: inline-block;
            background: var(--main);
            color: #fff;
            text-decoration: none;
            padding: 0.7rem 1.8rem;
            border-radius: 20px;
        }
        .section-title {
            text-align: center;
            font-size: 1.7rem;
            margin-bottom: 2.5rem;
            color: var(--text);
        }
        .goods {
            padding: 4rem 5%;
            background: var(--bg);
        }
        .goods-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
        }
        .goods-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        .goods-img {
            height: 180px;
        }
        .goods-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .goods-info {
            padding: 1rem;
        }
        .goods-name {
            margin-bottom: 0.5rem;
        }
        .goods-price {
            color: var(--main);
            font-weight: bold;
        }
        .team {
            padding: 4rem 5%;
        }
        .team-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            text-align: center;
        }
        .team-card {
            padding: 1.5rem;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-radius: 8px;
        }
        .team-avatar {
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            background: var(--main);
            color: #fff;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }
        .team-job {
            color: var(--main);
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }
        .team-desc {
            color: var(--gray);
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            nav a:not(.btn) {
                display: none;
            }
            .banner h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo"><span>🛒</span> 精选好物</div>
    <nav>
        <a href="#">首页</a>
        <a href="#">商品</a>
        <a href="#">团队</a>
        <a href="#" class="btn">立即选购</a>
    </nav>
</header>

<section class="banner">
    <h1>严选好物 实惠购物</h1>
    <p>品质保障 | 极速发货 | 售后无忧</p>
    <a href="#">查看全部商品</a>
</section>

<section class="goods">
    <h2 class="section-title">热门商品</h2>
    <div class="goods-list">
        <div class="goods-card">
            <div class="goods-img">
                <img src="https://img.alicdn.com/img/O1CN01y4Zrpj1ql5LrQc0lB_!!734575535.jpg" alt="收纳盒">
            </div>
            <div class="goods-info">
                <div class="goods-name">简约收纳礼盒</div>
                <div class="goods-price">¥79</div>
            </div>
        </div>

        <div class="goods-card">
            <div class="goods-img">
                <img src="https://img.alicdn.com/img/O1CN01Hn9A5C1pCRnH5Zm2U_!!3348475324.jpg" alt="玻璃水杯">
            </div>
            <div class="goods-info">
                <div class="goods-name">家用玻璃水杯</div>
                <div class="goods-price">¥29</div>
            </div>
        </div>

        <!-- 第三张图片已替换为新链接 -->
        <div class="goods-card">
            <div class="goods-img">
                <img src="https://img.alicdn.com/img/O1CN01LB6DDJ1LPKRnVvc4V_!!2212763661291.jpg" alt="棉麻抱枕">
            </div>
            <div class="goods-info">
                <div class="goods-name">舒适棉麻抱枕</div>
                <div class="goods-price">¥49</div>
            </div>
        </div>
    </div>
</section>

<section class="team">
    <h2 class="section-title">专业买手团队</h2>
    <div class="team-list">
        <div class="team-card">
            <div class="team-avatar">👩</div>
            <h3>林晓</h3>
            <p class="team-job">家居品类买手</p>
            <p class="team-desc">精选实用高颜值家居好物</p>
        </div>
        <div class="team-card">
            <div class="team-avatar">👨</div>
            <h3>周明</h3>
            <p class="team-job">餐厨品类买手</p>
            <p class="team-desc">严选安全耐用餐厨用品</p>
        </div>
        <div class="team-card">
            <div class="team-avatar">👩</div>
            <h3>陈悦</h3>
            <p class="team-job">文创品类买手</p>
            <p class="team-desc">发掘小众精致文创好物</p>
        </div>
    </div>
</section>

</body>
</html>
