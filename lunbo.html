<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片轮播</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#111;margin:0;}
        .box{width:90%;max-width:1000px;height:600px;position:relative;overflow:hidden;border-radius:12px;box-shadow:0 0 40px #0008;}
        .imgs{display:flex;width:500%;height:100%;transition:0.5s ease;}
        .imgs img{width:100%;height:100%;object-fit:cover;display:block;}
        .btn{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;background:#0006;color:#fff;border:none;border-radius:50%;font-size:24px;cursor:pointer;z-index:10;}
        .prev{left:20px;}
        .next{right:20px;}
        .dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;}
        .dot{width:12px;height:12px;background:#fff8;border-radius:50%;cursor:pointer;}
        .dot.active{background:#fff;}
    </style>
</head>
<body>
<div class="box">
  <div class="imgs" id="imgs">
    <!-- 严格对应每个文件真实后缀 -->
    <img src="imgs/1.jpg" alt="图1">
    <img src="imgs/2.jpg" alt="图2">
    <img src="imgs/3.webp" alt="图3">
    <img src="imgs/4.png" alt="图4">
    <img src="imgs/5.jpg" alt="图5">
  </div>
  <button class="btn prev" onclick="prev()"><</button>
  <button class="btn next" onclick="next()">></button>
  <div class="dots">
    <span class="dot active" onclick="switchIndex(0)"></span>
    <span class="dot" onclick="switchIndex(1)"></span>
    <span class="dot" onclick="switchIndex(2)"></span>
    <span class="dot" onclick="switchIndex(3)"></span>
    <span class="dot" onclick="switchIndex(4)"></span>
  </div>
</div>
<script>
  let cur = 0;
  const imgsWrap = document.getElementById("imgs");
  const dots = document.querySelectorAll(".dot");
  const total = 5;

  function update() {
    imgsWrap.style.transform = `translateX(-${cur * 20}%)`;
    dots.forEach((dot, idx) => dot.classList.toggle("active", idx === cur));
  }
  function next() {
    cur = (cur + 1) % total;
    update();
  }
  function prev() {
    cur = (cur - 1 + total) % total;
    update();
  }
  function switchIndex(idx) {
    cur = idx;
    update();
  }
  // 自动轮播3秒切换一次
  setInterval(next, 3000);
</script>
</body>
</html>
